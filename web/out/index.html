<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodeArts 网关管理面板</title>
  <style>
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { background: #fff; border-radius: 12px; padding: 40px 48px; box-shadow: 0 2px 12px rgba(0,0,0,.08); text-align: center; max-width: 420px; }
    h1 { font-size: 18px; margin: 0 0 12px; color: #1a1a2e; }
    p { font-size: 14px; color: #6b7280; line-height: 1.7; margin: 0; }
    code { background: #f3f4f6; border-radius: 4px; padding: 2px 6px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>管理面板尚未构建</h1>
    <p>当前二进制内嵌的是占位页面。请通过 GitHub Actions 流水线构建：前端静态产物会在 CI 中生成并覆盖本页，最终 Release 发布的二进制自带完整管理面板。</p>
    <p style="margin-top:12px">本地构建请先执行 <code>cd web && npm install && npm run build</code> 再编译后端。</p>
  </div>
</body>
</html>
