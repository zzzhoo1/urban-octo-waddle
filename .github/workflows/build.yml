name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  frontend:
    name: Build frontend (Next.js static export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Build static export
        working-directory: web
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: web/out
          retention-days: 7

  backend:
    name: Build gateway binary (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: web-out
          path: web/out

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package artifact
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/gateway dist/codearts-gateway
          chmod +x dist/codearts-gateway
          cd dist
          sha256sum codearts-gateway > codearts-gateway.sha256
          tar -czf codearts-gateway-v2-linux-x86_64.tar.gz codearts-gateway codearts-gateway.sha256

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: codearts-gateway-linux-x86_64
          path: dist/
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: backend
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: codearts-gateway-linux-x86_64
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/codearts-gateway-v2-linux-x86_64.tar.gz
            dist/codearts-gateway
            dist/codearts-gateway.sha256
          generate_release_notes: true
