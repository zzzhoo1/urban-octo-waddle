[package]
name = "codearts-gateway"
version = "2.0.0"
edition = "2021"
description = "CodeArts OpenAI-compatible multi-account gateway (Rust rewrite)"
license = "MIT"

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["http2"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-gzip", "catch-panic"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
aes-gcm = "0.10"
base64 = "0.22"
argon2 = "0.5"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
dashmap = "6"
parking_lot = "0.12"
url = "2"
futures-util = "0.3"
bytes = "1"
http-body-util = "0.1"
rust-embed = { version = "8", features = ["axum"] }
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# A1: panic 恢复为展开语义，由最外层捕获层按请求隔离（不再整站中断）
